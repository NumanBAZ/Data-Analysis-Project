<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/images/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary Meta Tags -->
    <title>Shadcn Admin</title>
    <meta name="title" content="Shadcn Admin" />
    <meta
      name="description"
      content="Admin Dashboard UI built with Shadcn and Vite."
    />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://shadcn-admin.netlify.app" />
    <meta property="og:title" content="Shadcn Admin" />
    <meta
      property="og:description"
      content="Admin Dashboard UI built with Shadcn and Vite."
    />
    <meta
      property="og:image"
      content="https://shadcn-admin.netlify.app/images/shadcn-admin.png"
    />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://shadcn-admin.netlify.app" />
    <meta property="twitter:title" content="Shadcn Admin" />
    <meta
      property="twitter:description"
      content="Admin Dashboard UI built with Shadcn and Vite."
    />
    <meta
      property="twitter:image"
      content="https://shadcn-admin.netlify.app/images/shadcn-admin.png"
    />

    <!-- font family -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Manrope:wght@200..800&display=swap"
      rel="stylesheet"
    />

    <meta name="theme-color" content="#fff" />
    <!-- Açılış animasyonu: React yüklenince main.tsx kaldırır -->
    <style>
      #splash { position: fixed; inset: 0; z-index: 9999; display: grid; place-items: center; background: #fff; transition: opacity .35s ease; }
      @media (prefers-color-scheme: dark) { #splash { background: #020817; } }
      #splash.hide { opacity: 0; pointer-events: none; }
      #splash .wrap { display: flex; flex-direction: column; align-items: center; gap: 22px; }
      #splash .logo { position: relative; width: 96px; height: 96px; }
      #splash .logo img { width: 96px; height: 96px; border-radius: 22px; animation: splash-pop .9s cubic-bezier(.2,.9,.3,1.2) both, splash-float 2.4s ease-in-out .9s infinite; box-shadow: 0 18px 40px -12px rgba(79,70,229,.55); }
      #splash .ring { position: absolute; inset: -14px; border-radius: 34px; border: 3px solid transparent; border-top-color: #6366f1; border-right-color: #22d3ee; animation: splash-spin 1.1s linear infinite; }
      #splash .bar { width: 160px; height: 4px; border-radius: 4px; background: rgba(99,102,241,.15); overflow: hidden; }
      #splash .bar::after { content: ""; display: block; width: 40%; height: 100%; border-radius: 4px; background: linear-gradient(90deg,#6366f1,#22d3ee); animation: splash-load 1.2s ease-in-out infinite; }
      #splash .txt { font: 500 14px system-ui, "Segoe UI", sans-serif; color: #64748b; letter-spacing: .02em; }
      @keyframes splash-spin { to { transform: rotate(360deg); } }
      @keyframes splash-pop { from { transform: scale(.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }
      @keyframes splash-float { 50% { transform: translateY(-5px); } }
      @keyframes splash-load { from { transform: translateX(-100%); } to { transform: translateX(260%); } }
      @media (prefers-reduced-motion: reduce) { #splash * { animation: none !important; } }
    </style>
  </head>

  <body>
    <div id="splash" role="status" aria-label="Yükleniyor">
      <div class="wrap">
        <div class="logo"><div class="ring"></div><img src="/images/app-icon.png" alt="" /></div>
        <div class="bar"></div>
        <div class="txt">Veriler hazırlanıyor…</div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
